<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Access Finder" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Find every currently eligible Topps Access / No Purchase Necessary baseball card product, see exact entry requirements and deadlines, and generate a print-ready mail-in submission packet." />
    <title>Topps Access Finder</title>
    <!--
      GitHub Pages is static hosting: a direct load/refresh of a deep link
      (e.g. /ToppsNPN/product/some-id) 404s because there's no server-side
      route handling. public/404.html redirects those to this page with the
      real path packed into a query string; this restores it via
      history.replaceState before the router mounts. No-op everywhere else.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <!--
      Catches anything React's error boundary can't: an error while the
      module script itself is loading/evaluating, before React ever mounts.
      Without this, that failure is a silent blank page with no clue why.
    -->
    <script>
      (function () {
        function showFatalError(message) {
          if (document.getElementById('fatal-error-banner')) return;
          var el = document.createElement('div');
          el.id = 'fatal-error-banner';
          el.style.cssText =
            'position:fixed;inset:0;z-index:99999;overflow:auto;padding:24px;' +
            'font-family:monospace;color:#fca5a5;background:#0b1220;white-space:pre-wrap;';
          el.textContent = 'Failed to load the app:\n\n' + message;
          document.body.appendChild(el);
        }
        window.addEventListener('error', function (e) {
          showFatalError((e.error && e.error.stack) || e.message || String(e));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          showFatalError((reason && reason.stack) || (reason && reason.message) || String(reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
