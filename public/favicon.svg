<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4d"/>
      <stop offset="1" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe3f0"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="0" cy="0" r="62"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- trading card -->
  <g transform="translate(236 244) rotate(-8)">
    <rect x="-118" y="-164" width="236" height="328" rx="22" fill="#0b1220" opacity=".45" transform="translate(8 12)"/>
    <rect x="-118" y="-164" width="236" height="328" rx="22" fill="url(#card)"/>
    <rect x="-98" y="-144" width="196" height="232" rx="12" fill="#131f3d"/>
    <rect x="-98" y="104" width="196" height="16" rx="8" fill="#35507f"/>
    <rect x="-98" y="130" width="120" height="14" rx="7" fill="#94a3b8"/>
    <!-- baseball -->
    <g transform="translate(0 -28)">
      <circle r="62" fill="#f8fafc"/>
      <g clip-path="url(#ball)" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round">
        <path d="M-44 -60 C-18 -24 -18 24 -44 60"/>
        <path d="M44 -60 C18 -24 18 24 44 60"/>
        <path stroke-width="4" d="M-38 -38 l-12 6 M-31 -20 l-13 3 M-28 0 h-13 M-31 20 l-13 -3 M-38 38 l-12 -6 M38 -38 l12 6 M31 -20 l13 3 M28 0 h13 M31 20 l13 -3 M38 38 l12 -6"/>
      </g>
    </g>
  </g>
  <!-- entry-sent badge -->
  <g transform="translate(372 378)">
    <circle r="86" fill="#070c17"/>
    <circle r="72" fill="#22c55e"/>
    <rect x="-40" y="-28" width="80" height="56" rx="8" fill="#ffffff"/>
    <path d="M-36 -22 L0 6 L36 -22" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
